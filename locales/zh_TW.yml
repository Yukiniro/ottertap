floatingWhilePlaying: "僅在選取的媒體播放時顯示"
floatingWhilePlayingDescription: "開啟後，只有目前選取的媒體正在播放時才顯示浮動入口。暫停一小會兒後才隱藏，避免快速暫停再播放時入口閃掉而點不到。沒有選取媒體時立刻隱藏。預設關閉，關閉時和現在一樣。不影響游標停在主播放區用滾輪調整音量。"
autoPipIntro: "這三項預設都關閉。開啟後，只有正在播放的選取影片會自己進出子母畫面。你自己打開或關掉子母畫面，仍然可以一起用。自動成功時，頁面上短暫顯示和手動相同的「子母畫面開」或「子母畫面關」；瀏覽器拒絕、是音訊或網站關掉了子母畫面時，出現原來的短說明，大約 10 秒內不會反覆重試。"
autoPipOnHide: "切到其他分頁時自動進入子母畫面"
autoPipOnHideDescription: "預設關閉。開啟後，離開分頁時，正在播放的選中影片會進入子母畫面。音訊、已暫停的影片、已停用小獺的網站和關閉了子母畫面的網站不會進入。瀏覽器可能先問一次是否允許本站這樣做；拒絕時出現原來的短說明，大約 10 秒內不會反覆重試。剛關掉子母畫面後 10 秒內再切走，不會馬上重新進入。"
autoPipOnScroll: "主影片捲出畫面時自動進入子母畫面"
autoPipOnScrollDescription: "預設關閉，與切換分頁那項互不影響。開啟後，選中的主影片正在播放且被捲到幾乎看不見時，會進入子母畫面。資訊流小卡片、頁面上的其他媒體、音訊和全螢幕時都不會進入；離開全螢幕後重新按這條規則判斷。在播放器下方稍微捲動不會觸發。瀏覽器只在你剛點過頁面或按過按鍵後才允許；否則出現原來的短說明，大約 10 秒後下一次點擊或按鍵才會再試。影片仍在畫面外時關掉子母畫面，要等你捲回影片後才會再次進入。"
autoPipExitOnReturn: "回到原分頁或影片回到畫面時自動退出子母畫面"
autoPipExitOnReturnDescription: "預設關閉，與上面兩項自動進入互不綁定。開啟後，只有這兩項自動打開的子母畫面，會在你回來時關掉：分頁重新顯示，並且影片至少有一半回到畫面。你自己打開的子母畫面不受影響。快速路過分頁或在播放器附近小幅捲動不會讓它關掉。關掉後 10 秒內再切走或捲走，不會馬上重新進入。"
autoPipExcludedSites: "不自動子母畫面的網站"
autoPipExcludedSitesDescription: "在這些網站上，上面三項都不會自動進入或退出子母畫面；你自己打開、關掉子母畫面照常可用。這和「網站規則」「隱藏浮動入口的網站」分開。網域包含其子網域。"
