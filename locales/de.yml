fullscreenWheelDescription: "Standardmäßig aus, deshalb ändert das Mausrad über dem Hauptplayer die Lautstärke weiterhin wie bisher. Eingeschaltet ändert das Mausrad ohne Alt die Lautstärke nur, wenn die Seite oder das Video im Vollbild ist, auch wenn der Player das Fenster füllt, ohne den Vollbildmodus des Browsers zu verwenden. Sonst scrollt das Mausrad die Seite. Alt + Mausrad ändert die Lautstärke auch außerhalb des Vollbilds."
