demoNote: "示範使用一段靜音的範例影片。安裝擴充功能後，控制的就是你正在看的網頁裡的影片和音訊。"
demoMediaTitle: "把日常剪成一部電影"
demoSecondTitle: "第二個音訊 · 多媒體切換示範"
floatingEyebrow: "浮動控制器"
floatingTitle: "控制跟著頁面走。"
floatingBody: "不用打開工具列，頁面側邊的小獺入口就能調音量。現在就試試，它已經在這個頁面的右側了。"
floatingTry: "試試頁面右側的小獺"
floatingPoint1: "小獺入口停靠在頁面邊緣，平時只露出一半，滑鼠移上去時完整顯示。"
floatingPoint2: "點一下入口展開音量藥丸，最高 200%，底部按鈕一鍵靜音。"
floatingPoint3: "可以拖到頁面左側或右側，下次打開網頁時仍在原來的位置。"
floatingPoint4: "按住 Alt + Shift，用方向鍵或滾輪以 10% 調整音量。"
featuresEyebrow: "功能"
featuresTitle: "看影片時最常用的控制，都在這裡。"
featuresSubtitle: "直接控制網頁裡正在播放的影片和音訊，不替換播放器，也不改變網頁版面。"
featurePlaybackTitle: "播放與進度"
featurePlaybackBody: "播放 / 暫停、前進 / 後退 10 秒、拖曳進度，直播內容也能控制。彈出面板可開關子母畫面。播放、快轉倒轉和靜音可用擴充功能命令，設定頁會顯示目前快捷鍵，包括頁內 Alt+Shift。"
featureBoostTitle: "音量放大到 200%"
featureBoostBody: "聲音太小時可以放大到 200%，限幅器壓住較響的片段，超過 100% 時工具列顯示角標。取消靜音會保留原音量，調高音量會自動解除靜音。"
featureSpeedTitle: "倍速"
featureSpeedBody: "預設檔位從 0.75× 到 4×，可在設定中編輯和排序。可選鎖定倍速，預設關閉；網站改回去時會寫回你設定的倍速。"
featureMultiTitle: "多個媒體"
featureMultiBody: "頁面有多個影片或音訊時，可自行選擇控制目標，網頁中嵌入的播放器也能控制。彈出面板還會列出其他正在發聲或已靜音的分頁。"
featureSitesTitle: "網站規則"
featureSitesBody: "在所有網站啟用，或只在指定網站啟用、在指定網站停用。新增 bilibili.com 即包含它的所有頁面。"
featureThemeTitle: "主題同步"
featureThemeBody: "淺色、深色或跟隨系統；彈出面板、設定頁和浮動控制器即時同步。"
privacyEyebrow: "隱私"
privacyTitle: "設定只留在你的瀏覽器裡。"
privacyBody: "擴充功能設定只保存在你的瀏覽器裡，無需帳號，也不上傳頁面資訊。本官網使用 Vercel Analytics 統計造訪情形。"
privacyPermissionsTitle: "需要的權限"
privacyStorage: "儲存設定：主題、浮動控制器和網站規則只保存在你的瀏覽器裡。"
privacyHosts: "存取網頁：用來找到網頁中的影片和音訊，並顯示浮動控制器。"
privacyNone: "不會存取麥克風、攝影機、下載紀錄或瀏覽歷史。"
installEyebrow: "安裝"
installTitle: "從 Chrome 線上應用程式商店安裝。"
installLead: "打開商品頁，一鍵加入小獺。不需要開發人員模式，也不用解壓縮。"
installStep1Title: "加到 Chrome"
installStep1Body: "打開 Chrome 線上應用程式商店的商品頁並確認新增。小獺會直接裝進瀏覽器。"
installStep2Title: "固定到工具列"
installStep2Body: "在擴充功能選單中固定小獺，工具列按鈕會一直留在手邊。"
installStep3Title: "開始使用"
installStep3Body: "重新整理已打開的媒體網頁，然後使用工具列中的小獺，或頁面上的浮動控制器。"
sideloadSummary: "從發布套件側載"
sideloadLead: "開發偵錯，或商店暫不可用時，可以下載發布套件，再以「載入未封裝項目」安裝。"
sideloadStep1Title: "下載"
sideloadStep1Body: "從 GitHub Releases 下載 ottertap-chrome.zip，解壓縮到一個固定資料夾。"
sideloadStep2Title: "打開擴充功能頁"
sideloadStep2Body: "Chrome 打開 chrome://extensions/，Edge 打開 edge://extensions/。"
sideloadStep3Title: "載入擴充功能"
sideloadStep3Body: "開啟開發人員模式，點「載入未封裝項目」，選擇包含 manifest.json 的資料夾。"
sideloadStep4Title: "開始使用"
sideloadStep4Body: "重新整理已打開的媒體網頁，點工具列中的小獺，或使用頁面浮動控制器。"
installUpdate: "更新側載版本時，用新套件覆蓋原資料夾，再點擴充功能卡片的「重新載入」，可保留本機設定。"
faqTitle: "常見問題"
faqBoostQ: "為什麼有的影片不能放大到 100% 以上？"
faqBoostA: "部分網站的影片由其他網域提供，瀏覽器出於安全限制不允許擴充功能處理它的聲音，此時音量最高為 100%。"
faqPagesQ: "哪些頁面無法控制？"
faqPagesA: "瀏覽器內建頁面、禁止擴充功能執行的頁面，以及部分網站特殊封裝的播放器無法控制。"
faqOverrideQ: "為什麼倍速或音量被網站改回去了？"
faqOverrideA: "部分網站會自行調整倍速或音量。可在設定中打開「鎖定倍速」（預設關閉）：網站把倍速改回去時，小獺會寫回你上次設定的倍速。它只鎖定倍速；若網站反覆改回，幾次之後會停止。音量被改回去時，在小獺裡重新設定即可。"
faqBrowsersQ: "支援哪些瀏覽器？"
faqBrowsersA: "支援 Chrome 和 Edge。安裝請走 Chrome 線上應用程式商店。Edge 增益集上架前，仍可從發布套件側載。"
