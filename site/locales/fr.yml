demoNote: "La démonstration utilise une vidéo d'exemple silencieuse. Une fois installé, OtterTap contrôle la vidéo et l'audio de la page que vous regardez."
demoMediaTitle: "Faire d'un quotidien un film"
demoSecondTitle: "Second audio · démonstration multi-médias"
floatingEyebrow: "Contrôle flottant"
floatingTitle: "Des commandes qui restent sur la page."
floatingBody: "Réglez le volume depuis la loutre au bord de la page, sans ouvrir la barre d'outils. Essayez-la : elle est déjà à droite de cette page."
floatingTry: "Essayer la loutre du bord droit"
floatingPoint1: "La loutre se pose au bord de la page, à moitié cachée, et apparaît entièrement au survol."
floatingPoint2: "Cliquez pour ouvrir la barre de volume jusqu'à 200 %, avec un bouton pour couper le son en bas."
floatingPoint3: "Faites-la glisser à gauche ou à droite. Elle y reste la prochaine fois que vous ouvrez une page."
floatingPoint4: "Tournez la molette sur le lecteur principal pour changer le volume par pas de 10 %. Les aperçus muets et les autres vidéos laissent la page défiler normalement. Maintenez Alt (Option sur Mac) n'importe où sur la page. La molette au survol se désactive dans les réglages."
featuresEyebrow: "Fonctions"
featuresTitle: "Les commandes les plus utiles, au même endroit."
featuresSubtitle: "OtterTap contrôle la vidéo et l'audio déjà en lecture sur la page. Il ne remplace pas les lecteurs et ne modifie pas la mise en page."
featurePlaybackTitle: "Lecture et progression"
featurePlaybackBody: "Lecture ou pause, saut selon le pas choisi dans les réglages, et recherche, y compris sur les directs. Activez l'image dans l'image depuis le panneau, et utilisez les commandes du navigateur pour la lecture, la recherche et le son. Dans la page, Alt + , . 0 règlent la vitesse et Alt + M coupe le son. Un mode touche unique facultatif, désactivé par défaut, ajoute K, J et L."
featureBoostTitle: "Volume amplifié jusqu'à 200 %"
featureBoostBody: "Quand une vidéo est trop faible, amplifiez le volume jusqu'à 200 %. Un limiteur empêche les crêtes de saturer, et la barre affiche un badge au-dessus de 100 %. Rétablir le son retrouve le volume précédent, et monter le volume réactive le son."
featureChannelTitle: "Modes de canal"
featureChannelBody: "Dans le panneau, choisissez stéréo (par défaut), mono, canal gauche seul ou canal droit seul. Cela se combine avec l'amplification du volume. Un média d'un autre site sans CORS ne peut pas changer de canaux, et Mémoriser ce site peut enregistrer le choix."
featureSpeedTitle: "Vitesse de lecture"
featureSpeedBody: "Des préréglages d'un geste, de 0,75× à 4×. Modifiez-les et réordonnez-les dans les réglages. Le verrouillage de la vitesse est facultatif et désactivé : s'il est activé, OtterTap réécrit votre dernière vitesse lorsqu'un site la change. Dans la page, Alt+0 (aussi lorsque le mode touche unique est activé) bascule entre 1× et la vitesse que vous venez d'utiliser sur cette page."
featureMultiTitle: "Plusieurs médias"
featureMultiBody: "Choisissez la cible quand une page contient plusieurs vidéos ou pistes audio, y compris les lecteurs intégrés. Le panneau liste aussi les autres onglets audibles ou en sourdine."
featureSitesTitle: "Règles de sites"
featureSitesBody: "Activez-le pour tous les sites, seulement pour ceux que vous choisissez, ou partout sauf ceux-là. Ajouter bilibili.com couvre toutes ses pages."
featureThemeTitle: "Thème synchronisé"
featureThemeBody: "Clair, sombre ou système. Le panneau, les réglages et le contrôle flottant changent aussitôt."
privacyEyebrow: "Confidentialité"
privacyTitle: "Vos réglages restent dans le navigateur."
privacyBody: "L'extension conserve vos réglages dans votre navigateur, sans compte, et n'envoie pas les informations des pages. Ce site utilise Vercel Analytics pour mesurer les visites."
privacyPermissionsTitle: "Ce dont elle a besoin"
privacyStorage: "Enregistrer les réglages : le thème, le contrôle flottant et les règles de sites restent dans votre navigateur."
privacyHosts: "Accéder aux pages : pour trouver la vidéo et l'audio, et afficher le contrôle flottant."
privacyNone: "Aucun accès au microphone, à la caméra, aux téléchargements ni à l'historique de navigation."
installEyebrow: "Installer"
installTitle: "Ajoutez-la depuis le Chrome Web Store."
installLead: "Ouvrez la fiche et ajoutez OtterTap en un clic. Pas de mode développeur, pas de décompression."
installStep1Title: "Ajouter à Chrome"
installStep1Body: "Ouvrez la fiche du Chrome Web Store et confirmez l'ajout. OtterTap s'installe directement dans le navigateur."
installStep2Title: "Épingler le bouton"
installStep2Body: "Épinglez OtterTap depuis le menu des extensions pour garder le bouton de la barre à portée de main."
installStep3Title: "Commencer à regarder"
installStep3Body: "Actualisez les pages de médias déjà ouvertes, puis utilisez le bouton de la barre ou le contrôle flottant."
sideloadSummary: "Installer depuis un paquet de version"
sideloadLead: "Pour le développement, ou lorsqu'une fiche de boutique n'est pas disponible, téléchargez le paquet et chargez l'extension non empaquetée."
sideloadStep1Title: "Télécharger"
sideloadStep1Body: "Téléchargez ottertap-chrome.zip depuis GitHub Releases et décompressez-le dans un dossier permanent."
sideloadStep2Title: "Ouvrir les extensions"
sideloadStep2Body: "Ouvrez chrome://extensions/ dans Chrome, ou edge://extensions/ dans Edge."
sideloadStep3Title: "Charger l'extension"
sideloadStep3Body: "Activez le mode développeur, cliquez sur Charger l'extension non empaquetée, puis choisissez le dossier qui contient manifest.json."
sideloadStep4Title: "Commencer à regarder"
sideloadStep4Body: "Actualisez les pages de médias ouvertes, puis cliquez sur OtterTap dans la barre ou utilisez le contrôle flottant."
installUpdate: "Pour mettre à jour une copie chargée ainsi, remplacez le même dossier par le nouveau paquet et cliquez sur Actualiser sur la fiche de l'extension. Les réglages locaux sont conservés."
faqTitle: "Questions fréquentes"
faqBoostQ: "Pourquoi certaines vidéos ne dépassent-elles pas 100 % ?"
faqBoostA: "Certains sites servent la vidéo depuis un autre domaine, et les règles de sécurité du navigateur n'autorisent pas l'extension à traiter ce son. Le maximum est alors de 100 %."
faqPagesQ: "Quelles pages ne peuvent pas être contrôlées ?"
faqPagesA: "Les pages intégrées du navigateur, les pages où les extensions ne peuvent pas s'exécuter, et certains lecteurs que les sites encapsulent d'une manière particulière."
faqOverrideQ: "Pourquoi un site a-t-il rétabli ma vitesse ou mon volume ?"
faqOverrideA: "Certains sites modifient eux-mêmes la vitesse ou le volume. Activez Verrouiller la vitesse dans les réglages : OtterTap réécrit alors votre dernière vitesse. L'option est désactivée par défaut, ne verrouille que la vitesse, et s'arrête si un site la réinitialise sans cesse. Si le volume change, réglez-le de nouveau dans OtterTap."
faqBrowsersQ: "Quels navigateurs sont pris en charge ?"
faqBrowsersA: "Chrome et Edge. L'installation se fait depuis le Chrome Web Store. Tant qu'une fiche des extensions Edge n'est pas disponible, vous pouvez aussi charger un paquet de version."
