floatingEyebrow: "Floating controller"
floatingTitle: "Controls that stay with the page."
floatingBody: "Adjust volume from the otter on the edge of the page, without opening the toolbar. Try it now: it is already on the right side of this page."
floatingTry: "Try the otter on the right edge"
floatingPoint1: "The otter rests on the edge of the page, half hidden, and fully appears when you hover over it."
floatingPoint2: "Click it to open a volume bar up to 200%, with a mute button at the bottom."
floatingPoint3: "Drag it to the left or right side. It stays there the next time you open a page."
floatingPoint4: "Scroll over the main player to change volume in 10% steps. Muted feed previews and other videos keep scrolling the page. Hold Alt (Option on Mac) and scroll anywhere on the page. You can turn off hover scrolling in settings."
featuresEyebrow: "Features"
featuresTitle: "The controls you reach for most, in one place."
featuresSubtitle: "OtterTap controls the video and audio already playing on the page. It does not replace players or change page layout."
featurePlaybackTitle: "Playback and progress"
featurePlaybackBody: "Play or pause, skip by the step set in settings, and drag to seek, including on live streams. Toggle picture-in-picture from the popup, and use browser commands for play, seek, and mute. On the page, Alt + , . 0 change speed and Alt + M mutes. An optional single-key mode, off by default, adds K, J and L."
featureBoostTitle: "Volume boost to 200%"
featureBoostBody: "When a video is too quiet, boost it up to 200%. A limiter keeps loud peaks from clipping, and the toolbar shows a badge above 100%. Unmuting restores the previous volume, and raising volume unmutes."
featureSpeedTitle: "Playback speed"
featureSpeedBody: "One-tap presets from 0.75× to 4×. Edit and reorder them in settings. Optional speed lock, off by default, writes your last speed back when a site changes it."
featureMultiTitle: "Multiple media"
featureMultiBody: "Pick the target when a page has several videos or audio tracks, including embedded players. The popup also lists other tabs that are audible or muted."
featureSitesTitle: "Site rules"
featureSitesBody: "Turn it on for all sites, only for sites you choose, or everywhere except them. Adding bilibili.com covers all of its pages."
featureThemeTitle: "Synced theme"
featureThemeBody: "Light, dark or system. The popup, settings and floating controller update instantly."
privacyEyebrow: "Privacy"
privacyTitle: "Your settings stay in your browser."
privacyBody: "The extension keeps your settings in your browser, requires no account, and does not upload page information. This website uses Vercel Analytics to measure visits."
privacyPermissionsTitle: "What it needs"
privacyStorage: "Saving settings: theme, floating controller and site rules stay in your browser."
privacyHosts: "Accessing pages: to find video and audio on the page and show the floating controller."
privacyNone: "No access to your microphone, camera, downloads or browsing history."
installEyebrow: "Install"
installTitle: "Add it from the Chrome Web Store."
installLead: "Open the listing and add OtterTap in one click. No developer mode, and no unzipping."
installStep1Title: "Add to Chrome"
installStep1Body: "Open the Chrome Web Store listing and confirm Add to Chrome. OtterTap installs straight into the browser."
installStep2Title: "Pin the button"
installStep2Body: "Pin OtterTap from the extensions menu so the toolbar button stays within reach."
installStep3Title: "Start watching"
installStep3Body: "Refresh open media pages, then use the toolbar button or the floating controller."
sideloadSummary: "Install from a release package"
sideloadLead: "For development, or when a store listing is unavailable, download the package and load the unpacked extension."
sideloadStep1Title: "Download"
sideloadStep1Body: "Download ottertap-chrome.zip from GitHub Releases and unzip it into a permanent folder."
sideloadStep2Title: "Open extensions"
sideloadStep2Body: "Open chrome://extensions/ in Chrome, or edge://extensions/ in Edge."
sideloadStep3Title: "Load the extension"
sideloadStep3Body: "Turn on Developer mode, click Load unpacked, and choose the folder that contains manifest.json."
sideloadStep4Title: "Start watching"
sideloadStep4Body: "Refresh open media pages, then click OtterTap in the toolbar or use the floating controller."
installUpdate: "To update a sideloaded copy, overwrite the same folder with the new package and click Reload on the extension card. Your local settings are kept."
faqTitle: "FAQ"
faqBoostQ: "Why can't some videos go above 100%?"
faqBoostA: "Some sites serve video from another domain, and the browser's security rules do not let extensions process that sound. The maximum is then 100%."
faqPagesQ: "Which pages can't be controlled?"
faqPagesA: "Built-in browser pages, pages where extensions are not allowed to run, and some players that sites wrap in special ways."
faqOverrideQ: "Why did a site reset my speed or volume?"
faqOverrideA: "Some sites change speed or volume on their own. Turn on Lock playback speed in settings and OtterTap writes your last speed back. It is off by default, only locks speed, and stops if a site keeps resetting it. If a site changes the volume, set it again in OtterTap."
faqBrowsersQ: "Which browsers are supported?"
faqBrowsersA: "Chrome and Edge. The Chrome Web Store is the install path. Edge can still be installed from a release package until an Edge Add-ons listing is available."
