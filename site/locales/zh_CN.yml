floatingEyebrow: "浮动控制器"
floatingTitle: "控制跟着页面走。"
floatingBody: "不用打开工具栏，页面侧边的小獭入口就能调音量。现在就试试，它已经在这个页面的右侧了。"
floatingTry: "试试页面右侧的小獭"
floatingPoint1: "小獭入口停靠在页面边缘，平时只露出一半，鼠标移上去时完整显示。"
floatingPoint2: "点击入口展开音量条，最高 150%，底部按钮一键静音。"
floatingPoint3: "可以拖到页面左侧或右侧，下次打开网页时仍在原来的位置。"
floatingPoint4: "按住 Alt + Shift，用方向键或滚轮按 10% 调节音量。"
featuresEyebrow: "功能"
featuresTitle: "看视频时最常用的控制，都在这里。"
featuresSubtitle: "直接控制网页里正在播放的视频和音频，不替换播放器，也不改变网页布局。"
featurePlaybackTitle: "播放与进度"
featurePlaybackBody: "播放 / 暂停、前进 / 后退 10 秒、拖动进度条，直播内容也能控制。"
featureBoostTitle: "音量放大到 150%"
featureBoostBody: "声音太小时可以放大到 150%；取消静音保留原音量，调高音量自动解除静音。"
featureSpeedTitle: "倍速"
featureSpeedBody: "0.75× 到 2× 一键切换。"
featureMultiTitle: "多个媒体"
featureMultiBody: "页面有多个视频或音频时自由选择控制目标，网页中嵌入的播放器也能控制。"
featureSitesTitle: "网站规则"
featureSitesBody: "在所有网站启用，或只在指定网站启用、在指定网站停用。添加 bilibili.com 即包含它的所有页面。"
featureThemeTitle: "主题同步"
featureThemeBody: "浅色、深色或跟随系统；弹出面板、设置页和浮动控制器即时同步。"
privacyEyebrow: "隐私"
privacyTitle: "设置只留在你的浏览器里。"
privacyBody: "没有账号，没有服务器，也不上传任何页面信息。"
privacyPermissionsTitle: "需要的权限"
privacyStorage: "保存设置：主题、浮动控制器和网站规则只保存在你的浏览器里。"
privacyHosts: "访问网页：用于找到网页中的视频和音频，并显示浮动控制器。"
privacyNone: "不会访问麦克风、摄像头、下载记录或浏览历史。"
installEyebrow: "安装"
installTitle: "四步装好。"
installStep1Title: "下载"
installStep1Body: "从 GitHub Releases 下载 ottertap-chrome.zip，解压到一个固定目录。"
installStep2Title: "打开扩展页"
installStep2Body: "Chrome 打开 chrome://extensions/，Edge 打开 edge://extensions/。"
installStep3Title: "加载扩展"
installStep3Body: "开启开发者模式，点击「加载已解压的扩展程序」，选择包含 manifest.json 的目录。"
installStep4Title: "开始使用"
installStep4Body: "刷新已打开的媒体网页，点击工具栏中的小獭，或使用页面浮动控制器。"
installUpdate: "更新时用新包覆盖原目录，再点击扩展卡片的「重新加载」，可保留本地设置。"
faqTitle: "常见问题"
faqBoostQ: "为什么有的视频不能放大到 100% 以上？"
faqBoostA: "部分网站的视频由其他域名提供，浏览器出于安全限制不允许扩展处理它的声音，此时音量最高为 100%。"
faqPagesQ: "哪些页面无法控制？"
faqPagesA: "浏览器内置页面、禁止扩展运行的页面，以及部分网站特殊封装的播放器无法控制。"
faqOverrideQ: "为什么倍速或音量被网站改回去了？"
faqOverrideA: "部分网站会自行调整倍速或音量。遇到这种情况，在小獭里重新设置一次即可。"
faqBrowsersQ: "支持哪些浏览器？"
faqBrowsersA: "支持 Chrome 和 Edge。"
