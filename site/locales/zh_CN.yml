demoNote: "演示使用一段静音的示例视频。安装扩展后，控制的就是你正在看的网页里的视频和音频。"
demoMediaTitle: "把日常剪成一部电影"
demoSecondTitle: "第二个音频 · 多媒体切换演示"
floatingEyebrow: "浮动控制器"
floatingTitle: "控制跟着页面走。"
floatingBody: "不用打开工具栏，页面侧边的小獭入口就能调音量。现在就试试，它已经在这个页面的右侧了。"
floatingTry: "试试页面右侧的小獭"
floatingPoint1: "小獭入口停靠在页面边缘，平时只露出一半，鼠标移上去时完整显示。"
floatingPoint2: "点击入口展开音量条，最高 200%，底部按钮一键静音。"
floatingPoint3: "可以拖到页面左侧或右侧，下次打开网页时仍在原来的位置。"
floatingPoint4: "鼠标停在主播放区滚动滚轮，按设置里的步长调节音量；信息流里的静音预览和其他视频上仍照常滚动页面。也可在页面任意位置按住 Alt（Mac 为 Option）滚动。悬停调节可在设置中关闭。"
featuresEyebrow: "功能"
featuresTitle: "看视频时最常用的控制，都在这里。"
featuresSubtitle: "直接控制网页里正在播放的视频和音频，不替换播放器，也不改变网页布局。"
featurePlaybackTitle: "播放与进度"
featurePlaybackBody: "播放 / 暂停、按设置中的步长前进 / 后退、拖动进度条，直播内容也能控制。弹出面板可开关画中画。扩展命令覆盖播放、快进快退、静音和画中画；画中画没有默认快捷键，需在浏览器的扩展快捷键页自行绑定。页内用 Alt + , . 0 调倍速、Alt + M 静音，页内没有画中画键；另有默认关闭的单键模式（K、J、L 等）。"
featureBoostTitle: "音量放大到 200%"
featureBoostBody: "声音太小时可以放大到 200%，限幅器压住响段，超过 100% 时工具栏显示角标。取消静音保留原音量，调高音量自动解除静音。"
featureChannelTitle: "声道模式"
featureChannelBody: "弹出面板可选立体声（默认）、单声道、只听左声道或只听右声道，并可与音量放大叠加。跨域且无 CORS 的媒体无法切换声道，选择可随「记住此站点」保存。"
featureSpeedTitle: "倍速"
featureSpeedBody: "默认预设从 0.75× 到 4×，可在设置中编辑和排序。设置里还可选全局默认倍速：还没记住倍速的站点，新媒体会应用一次；已记住该站的倍速优先；默认跟随网页。可选锁定倍速，默认关闭；站点改回去时会写回你设定的倍速。页内 Alt+0（单键模式开启时同样）在 1× 与本页刚才的倍速间切换。"
featureMultiTitle: "多个媒体"
featureMultiBody: "页面有多个视频或音频时自由选择控制目标，网页中嵌入的播放器也能控制。弹出面板还会列出其他正在发声或已静音的标签页。"
featureSitesTitle: "网站规则"
featureSitesBody: "在所有网站启用，或只在指定网站启用、在指定网站停用。添加 bilibili.com 即包含它的所有页面。"
featureThemeTitle: "主题同步"
featureThemeBody: "浅色、深色或跟随系统；弹出面板、设置页和浮动控制器即时同步。"
privacyEyebrow: "隐私"
privacyTitle: "设置只留在你的浏览器里。"
privacyBody: "扩展设置只保存在你的浏览器里，无需账号，也不上传页面信息。设置页可以导出和导入全部设置，重装或换浏览器时能带走。本官网使用 Vercel Analytics 统计访问情况。"
privacyPermissionsTitle: "需要的权限"
privacyStorage: "保存设置：主题、浮动控制器和网站规则只保存在你的浏览器里。"
privacyHosts: "访问网页：用于找到网页中的视频和音频，并显示浮动控制器。"
privacyNone: "不会访问麦克风、摄像头、下载记录或浏览历史。"
installEyebrow: "安装"
installTitle: "从 Chrome 网上应用店安装。"
installLead: "打开商品页，一键添加小獭。不需要开发者模式，也不用解压。"
installStep1Title: "添加到 Chrome"
installStep1Body: "打开 Chrome 网上应用店的商品页，确认添加。小獭会直接装进浏览器。"
installStep2Title: "固定到工具栏"
installStep2Body: "在扩展菜单里固定小獭，工具栏按钮会一直留在手边。"
installStep3Title: "开始使用"
installStep3Body: "刷新已打开的媒体网页，然后使用工具栏中的小獭，或页面上的浮动控制器。"
sideloadSummary: "从发布包侧载"
sideloadLead: "开发调试，或商店暂不可用时，可以下载发布包，再以「加载已解压的扩展程序」安装。"
sideloadStep1Title: "下载"
sideloadStep1Body: "从 GitHub Releases 下载 ottertap-chrome.zip，解压到一个固定目录。"
sideloadStep2Title: "打开扩展页"
sideloadStep2Body: "Chrome 打开 chrome://extensions/，Edge 打开 edge://extensions/。"
sideloadStep3Title: "加载扩展"
sideloadStep3Body: "开启开发者模式，点击「加载已解压的扩展程序」，选择包含 manifest.json 的目录。"
sideloadStep4Title: "开始使用"
sideloadStep4Body: "刷新已打开的媒体网页，点击工具栏中的小獭，或使用页面浮动控制器。"
installUpdate: "更新侧载版本时，用新包覆盖原目录，再点击扩展卡片的「重新加载」，可保留本地设置。换到商店版或其他浏览器之前，先在设置页导出备份，安装后再导入。"
faqTitle: "常见问题"
faqBoostQ: "为什么有的视频不能放大到 100% 以上？"
faqBoostA: "部分网站的视频由其他域名提供，浏览器出于安全限制不允许扩展处理它的声音，此时音量最高为 100%。"
faqPagesQ: "哪些页面无法控制？"
faqPagesA: "浏览器内置页面、禁止扩展运行的页面，以及部分网站特殊封装的播放器无法控制。"
faqOverrideQ: "为什么倍速或音量被网站改回去了？"
faqOverrideA: "部分网站会自行调整倍速或音量。可在设置中打开「锁定倍速」（默认关闭）：站点把倍速改回去时，小獭会写回你上次设定的倍速。它只锁定倍速；若站点反复改回，几次之后会停止。音量被改回去时，在小獭里重新设置即可。"
faqBrowsersQ: "支持哪些浏览器？"
faqBrowsersA: "支持 Chrome 和 Edge。安装请走 Chrome 网上应用店。Edge 加载项上架前，仍可从发布包侧载。"
