demoMediaTitle: "일상을 한 편의 영화로"
demoSecondTitle: "두 번째 오디오 · 여러 미디어 전환"
floatingEyebrow: "플로팅 컨트롤러"
floatingTitle: "제어가 페이지를 따라옵니다."
floatingBody: "도구 모음을 열지 않아도 페이지 가장자리의 수달로 음량을 조절할 수 있습니다. 이 페이지 오른쪽에서 바로 써 보세요."
floatingTry: "오른쪽 가장자리의 수달을 써 보기"
floatingPoint1: "수달은 페이지 가장자리에 붙고, 평소에는 절반만 보이다가 마우스를 올리면 전체가 나타납니다."
floatingPoint2: "클릭하면 음량 막대가 열리고 최대 200%까지 올릴 수 있습니다. 맨 아래 버튼으로 음소거합니다."
floatingPoint3: "왼쪽이나 오른쪽으로 끌어 옮길 수 있습니다. 다음에 페이지를 열어도 그 자리에 있습니다."
floatingPoint4: "Alt + Shift를 누른 채 방향키나 마우스 휠로 음량을 10%씩 조절합니다."
featuresEyebrow: "기능"
featuresTitle: "자주 쓰는 제어를 한곳에."
featuresSubtitle: "페이지에서 재생 중인 동영상과 오디오를 직접 제어합니다. 플레이어를 바꾸거나 페이지 레이아웃을 건드리지 않습니다."
featurePlaybackTitle: "재생과 진행"
featurePlaybackBody: "재생과 일시정지, 10초 이동, 탐색을 지원하며 라이브도 제어할 수 있습니다. 팝업에서 화면 속 화면을 켜고 끌 수 있습니다. 재생, 탐색, 음소거는 브라우저 명령으로도 쓸 수 있습니다. 설정에는 페이지 안 Alt+Shift를 포함한 현재 단축키가 표시됩니다."
featureBoostTitle: "음량을 200%까지 증폭"
featureBoostBody: "소리가 너무 작으면 200%까지 증폭할 수 있습니다. 리미터가 큰 소리의 왜곡을 누르고, 100%를 넘으면 도구 모음에 배지가 나타납니다. 음소거를 해제하면 이전 음량으로 돌아가고, 음량을 올리면 음소거가 풀립니다."
featureSpeedTitle: "배속"
featureSpeedBody: "0.75×부터 4×까지 프리셋을 한 번에 고릅니다. 설정에서 편집하고 순서를 바꿀 수 있습니다. 배속 고정은 기본적으로 꺼져 있으며, 켜면 사이트가 배속을 되돌릴 때 마지막 배속을 다시 씁니다."
featureMultiTitle: "여러 미디어"
featureMultiBody: "페이지에 동영상이나 오디오가 여러 개이면, 삽입된 플레이어를 포함해 제어할 대상을 고릅니다. 팝업에는 소리가 나거나 음소거된 다른 탭도 나열됩니다."
featureSitesTitle: "사이트 규칙"
featureSitesBody: "모든 사이트에서 켜거나, 고른 사이트에서만 켜거나, 고른 사이트를 빼고 켤 수 있습니다. bilibili.com을 추가하면 그 사이트의 모든 페이지가 포함됩니다."
featureThemeTitle: "테마 동기화"
featureThemeBody: "밝게, 어둡게, 또는 시스템을 따릅니다. 팝업, 설정, 플로팅 컨트롤러가 바로 바뀝니다."
privacyEyebrow: "개인정보"
privacyTitle: "설정은 브라우저 안에만 남습니다."
privacyBody: "확장 프로그램 설정은 이 브라우저에만 저장됩니다. 계정이 필요 없고, 페이지 정보를 업로드하지 않습니다. 이 웹사이트는 방문 수를 보기 위해 Vercel Analytics를 사용합니다."
privacyPermissionsTitle: "필요한 권한"
privacyStorage: "설정 저장: 테마, 플로팅 컨트롤러, 사이트 규칙은 이 브라우저에만 남습니다."
privacyHosts: "페이지 접근: 페이지의 동영상과 오디오를 찾고 플로팅 컨트롤러를 표시하기 위해서입니다."
privacyNone: "마이크, 카메라, 다운로드 기록, 방문 기록에는 접근하지 않습니다."
installEyebrow: "설치"
installTitle: "웹 스토어에서 추가하세요."
installLead: "제품 페이지를 열고 OtterTap을 한 번에 추가합니다. 개발자 모드도, 압축 해제도 필요 없습니다."
installStep1Title: "Chrome에 추가"
installStep1Body: "Chrome 웹 스토어 제품 페이지를 열고 추가를 확인합니다. OtterTap이 브라우저에 바로 설치됩니다."
installStep2Title: "버튼을 고정"
installStep2Body: "확장 프로그램 메뉴에서 OtterTap을 고정하면 도구 모음 버튼이 손 가까이에 남습니다."
installStep3Title: "시청 시작"
installStep3Body: "열려 있는 미디어 페이지를 새로고침한 다음, 도구 모음 버튼이나 플로팅 컨트롤러를 사용합니다."
sideloadSummary: "릴리스 패키지로 불러오기"
sideloadLead: "개발할 때, 또는 스토어 페이지를 쓸 수 없을 때는 패키지를 받아 압축해제된 확장 프로그램으로 불러올 수 있습니다."
sideloadStep1Title: "다운로드"
sideloadStep1Body: "GitHub Releases에서 ottertap-chrome.zip을 받아 계속 둘 폴더에 압축을 풉니다."
sideloadStep2Title: "확장 프로그램 페이지 열기"
sideloadStep2Body: "Chrome에서는 chrome://extensions/, Edge에서는 edge://extensions/ 를 엽니다."
sideloadStep3Title: "확장 프로그램 로드"
sideloadStep3Body: "개발자 모드를 켜고 ‘압축해제된 확장 프로그램을 로드합니다’에서 manifest.json이 있는 폴더를 선택합니다."
sideloadStep4Title: "시청 시작"
sideloadStep4Body: "열려 있는 미디어 페이지를 새로고침한 다음, 도구 모음의 OtterTap을 누르거나 플로팅 컨트롤러를 사용합니다."
installUpdate: "불러온 버전을 업데이트할 때는 같은 폴더를 새 패키지로 덮어쓰고 확장 프로그램 카드의 새로고침을 누릅니다. 이 브라우저의 설정은 유지됩니다."
faqTitle: "자주 묻는 질문"
faqBoostQ: "어떤 동영상은 100%를 넘길 수 없나요?"
faqBoostA: "동영상을 다른 도메인에서 제공하는 사이트에서는 브라우저 보안 규칙 때문에 확장 프로그램이 그 소리를 처리할 수 없습니다. 이때 최대 음량은 100%입니다."
faqPagesQ: "제어할 수 없는 페이지는 무엇인가요?"
faqPagesA: "브라우저 내장 페이지, 확장 프로그램 실행이 허용되지 않은 페이지, 사이트가 특별한 방식으로 감싼 일부 플레이어는 제어할 수 없습니다."
faqOverrideQ: "배속이나 음량이 사이트에 의해 되돌아가나요?"
faqOverrideA: "일부 사이트는 배속이나 음량을 스스로 바꿉니다. 설정에서 ‘배속 고정’을 켜면 OtterTap이 마지막으로 정한 배속을 다시 씁니다. 기본값은 꺼짐이고, 고정하는 것은 배속뿐입니다. 사이트가 계속 되돌리면 몇 번 뒤에 멈춥니다. 음량이 되돌아가면 OtterTap에서 다시 맞추면 됩니다."
faqBrowsersQ: "어떤 브라우저를 지원하나요?"
faqBrowsersA: "Chrome과 Edge를 지원합니다. 설치는 Chrome 웹 스토어에서 합니다. Edge 추가 기능 페이지가 생기기 전에는 릴리스 패키지로 불러올 수도 있습니다."
footerTagline: "OtterTap · 웹 미디어 제어"
footerReleases: "릴리스"
