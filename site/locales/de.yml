demoSecondTitle: "Zweites Audio · Demo mit mehreren Medien"
floatingEyebrow: "Schwebende Steuerung"
floatingTitle: "Die Steuerung bleibt auf der Seite."
floatingBody: "Ändern Sie die Lautstärke über den Otter am Seitenrand, ohne die Symbolleiste zu öffnen. Probieren Sie ihn aus: Er ist schon rechts auf dieser Seite."
floatingTry: "Den Otter am rechten Rand ausprobieren"
floatingPoint1: "Der Otter sitzt am Seitenrand, zur Hälfte verdeckt, und erscheint vollständig, wenn Sie den Zeiger darüber bewegen."
floatingPoint2: "Ein Klick öffnet den Lautstärkebalken bis 200 %, mit einer Stummschaltung unten."
floatingPoint3: "Ziehen Sie ihn nach links oder rechts. Beim nächsten Öffnen einer Seite bleibt er dort."
floatingPoint4: "Halten Sie Alt (auf dem Mac Option) und drehen Sie das Mausrad, um die Lautstärke in 10-%-Schritten zu ändern. Mit dem Mausrad über dem Video in den Einstellungen geht es auch ohne Taste."
featuresEyebrow: "Funktionen"
featuresTitle: "Die Steuerung, die Sie am häufigsten brauchen."
featuresSubtitle: "OtterTap steuert das Video und Audio, das auf der Seite bereits läuft. Es ersetzt keine Player und ändert nicht das Seitenlayout."
featurePlaybackTitle: "Wiedergabe und Fortschritt"
featurePlaybackBody: "Wiedergeben oder anhalten, 10 Sekunden springen und suchen, auch bei Livestreams. Bild-in-Bild schalten Sie im Popup. Wiedergabe, Suche und Stummschaltung gehen auch über Browserbefehle. Auf der Seite ändern Alt + , . 0 das Tempo und Alt + M schaltet stumm. Ein optionaler Einzeltastenmodus, standardmäßig aus, ergänzt K, J und L."
featureBoostTitle: "Lautstärke auf 200 % erhöhen"
featureBoostBody: "Ist ein Video zu leise, erhöhen Sie die Lautstärke auf bis zu 200 %. Ein Limiter hält laute Spitzen vom Übersteuern ab, und über 100 % zeigt die Symbolleiste ein Zeichen. Das Aufheben der Stummschaltung stellt die vorherige Lautstärke wieder her, und lauter stellen hebt die Stummschaltung auf."
featureSpeedTitle: "Tempo"
featureSpeedBody: "Voreinstellungen von 0,75× bis 4× mit einem Tipp. Bearbeiten und sortieren Sie sie in den Einstellungen. Tempo sperren ist optional und aus: Ist es an, schreibt OtterTap Ihr letztes Tempo zurück, wenn eine Website es ändert."
featureMultiTitle: "Mehrere Medien"
featureMultiBody: "Wählen Sie das Ziel, wenn eine Seite mehrere Videos oder Audiospuren hat, auch eingebettete Player. Das Popup listet außerdem andere hörbare oder stummgeschaltete Tabs."
featureSitesTitle: "Websiteregeln"
featureSitesBody: "Schalten Sie es für alle Websites ein, nur für ausgewählte oder für alle außer diesen. bilibili.com umfasst alle Seiten dieser Website."
featureThemeTitle: "Synchrones Design"
featureThemeBody: "Hell, dunkel oder System. Popup, Einstellungen und schwebende Steuerung wechseln sofort."
privacyEyebrow: "Datenschutz"
privacyTitle: "Ihre Einstellungen bleiben im Browser."
privacyBody: "Die Erweiterung speichert Ihre Einstellungen im Browser, braucht kein Konto und lädt keine Seiteninformationen hoch. Diese Website nutzt Vercel Analytics, um Besuche zu messen."
privacyPermissionsTitle: "Was sie braucht"
privacyStorage: "Einstellungen speichern: Design, schwebende Steuerung und Websiteregeln bleiben in Ihrem Browser."
privacyHosts: "Zugriff auf Seiten: um Video und Audio auf der Seite zu finden und die schwebende Steuerung anzuzeigen."
privacyNone: "Kein Zugriff auf Mikrofon, Kamera, Downloads oder den Browserverlauf."
installEyebrow: "Installieren"
installTitle: "Aus dem Chrome Web Store hinzufügen."
installLead: "Öffnen Sie den Eintrag und fügen Sie OtterTap mit einem Klick hinzu. Kein Entwicklermodus und kein Entpacken."
installStep1Title: "Zu Chrome hinzufügen"
installStep1Body: "Öffnen Sie den Eintrag im Chrome Web Store und bestätigen Sie das Hinzufügen. OtterTap wird direkt im Browser installiert."
installStep2Title: "Schaltfläche anheften"
installStep2Body: "Heften Sie OtterTap im Erweiterungsmenü an, damit die Schaltfläche in der Symbolleiste griffbereit bleibt."
installStep3Title: "Ansehen starten"
installStep3Body: "Laden Sie offene Medienseiten neu und nutzen Sie die Schaltfläche in der Symbolleiste oder die schwebende Steuerung."
sideloadSummary: "Aus einem Release-Paket laden"
sideloadLead: "Für die Entwicklung, oder wenn kein Store-Eintrag verfügbar ist, laden Sie das Paket herunter und installieren die entpackte Erweiterung."
sideloadStep1Title: "Herunterladen"
sideloadStep1Body: "Laden Sie ottertap-chrome.zip von GitHub Releases herunter und entpacken Sie es in einen festen Ordner."
sideloadStep2Title: "Erweiterungen öffnen"
sideloadStep2Body: "Öffnen Sie chrome://extensions/ in Chrome oder edge://extensions/ in Edge."
sideloadStep3Title: "Erweiterung laden"
sideloadStep3Body: "Schalten Sie den Entwicklermodus ein, klicken Sie auf Entpackte Erweiterung laden und wählen Sie den Ordner mit manifest.json."
sideloadStep4Title: "Ansehen starten"
sideloadStep4Body: "Laden Sie offene Medienseiten neu, klicken Sie dann auf OtterTap in der Symbolleiste oder nutzen Sie die schwebende Steuerung."
installUpdate: "Um eine so geladene Kopie zu aktualisieren, überschreiben Sie denselben Ordner mit dem neuen Paket und klicken auf der Erweiterungskarte auf Neu laden. Ihre lokalen Einstellungen bleiben erhalten."
faqTitle: "Häufige Fragen"
faqBoostQ: "Warum gehen manche Videos nicht über 100 %?"
faqBoostA: "Manche Websites liefern das Video von einer anderen Domain aus. Die Sicherheitsregeln des Browsers lassen dann nicht zu, dass die Erweiterung diesen Ton verarbeitet. Das Maximum liegt dann bei 100 %."
faqPagesQ: "Welche Seiten lassen sich nicht steuern?"
faqPagesA: "Eingebaute Browserseiten, Seiten, auf denen Erweiterungen nicht laufen dürfen, und manche Player, die Websites auf besondere Weise kapseln."
faqOverrideQ: "Warum setzt eine Website mein Tempo oder meine Lautstärke zurück?"
faqOverrideA: "Manche Websites ändern Tempo oder Lautstärke selbst. Schalten Sie in den Einstellungen Tempo sperren ein, dann schreibt OtterTap Ihr letztes Tempo zurück. Die Option ist standardmäßig aus, sperrt nur das Tempo und stoppt, wenn eine Website es immer wieder zurücksetzt. Ändert eine Website die Lautstärke, stellen Sie sie in OtterTap erneut ein."
faqBrowsersQ: "Welche Browser werden unterstützt?"
faqBrowsersA: "Chrome und Edge. Installiert wird über den Chrome Web Store. Solange kein Edge-Add-ons-Eintrag verfügbar ist, können Sie das Release-Paket weiterhin laden."
