demoRemoveSecond: "2 つ目のメディアを削除"
demoNote: "デモは無音のサンプル動画です。インストール後は、見ているページの動画と音声を操作します。"
demoMediaTitle: "日常を一本の映画に"
demoSecondTitle: "2 つ目の音声 · 複数メディアの切り替え"
floatingEyebrow: "フローティングコントローラー"
floatingTitle: "操作はページのそばに。"
floatingBody: "ツールバーを開かなくても、ページの端にいるカワウソから音量を変えられます。このページの右側ですぐ試せます。"
floatingTry: "右端のカワウソを試す"
floatingPoint1: "カワウソはページの端に寄り、普段は半分だけ見えています。マウスを乗せると全体が表示されます。"
floatingPoint2: "クリックすると音量バーが開き、最大 200% まで上げられます。一番下のボタンでミュートします。"
floatingPoint3: "左側か右側へドラッグできます。次にページを開いたときも、その位置のままです。"
floatingPoint4: "Alt（Mac では Option）を押しながらホイールを回すと、音量を 10% ずつ変えます。設定で動画上のホイール操作をオンにすると、キーは不要です。"
featuresEyebrow: "機能"
featuresTitle: "よく使う操作を、ひとところに。"
featuresSubtitle: "ページで再生中の動画と音声を直接操作します。プレーヤーは置き換えず、ページのレイアウトも変えません。"
featurePlaybackTitle: "再生と位置"
featurePlaybackBody: "再生と一時停止、10 秒の移動、シークに対応し、ライブも操作できます。ポップアップからピクチャーインピクチャーを切り替えられます。再生、シーク、ミュートはブラウザーのコマンドでも使えます。ページ内では Alt + , . 0 で速度、Alt + M でミュート。既定でオフのシングルキーモード（K、J、L など）もあります。"
featureBoostTitle: "音量を 200% まで増幅"
featureBoostBody: "小さすぎる音は 200% まで増幅できます。リミッターが大きい音の歪みを抑え、100% を超えるとツールバーにバッジが出ます。ミュートを解除すると以前の音量に戻り、音量を上げるとミュートは解除されます。"
featureSpeedTitle: "再生速度"
featureSpeedBody: "0.75× から 4× までのプリセットをワンタップで選べます。設定で編集や並べ替えができます。速度の固定は初期状態ではオフです。オンにすると、サイトが速度を戻したときに最後の速度を書き戻します。"
featureMultiTitle: "複数のメディア"
featureMultiBody: "ページに動画や音声が複数あるときは、埋め込みプレーヤーを含めて操作対象を選べます。ポップアップには、音の出ているタブとミュート中のタブも並びます。"
featureSitesTitle: "サイトルール"
featureSitesBody: "すべてのサイトで有効にするか、選んだサイトだけ有効にするか、選んだサイト以外で有効にするかを選べます。bilibili.com を追加すると、そのサイトのすべてのページが対象です。"
featureThemeTitle: "テーマを同期"
featureThemeBody: "ライト、ダーク、またはシステムに合わせます。ポップアップ、設定、フローティングコントローラーはすぐ切り替わります。"
privacyEyebrow: "プライバシー"
privacyTitle: "設定はこのブラウザーの中だけ。"
privacyBody: "拡張機能の設定はこのブラウザーに保存され、アカウントは不要で、ページの情報はアップロードしません。このサイトでは、訪問状況の計測に Vercel Analytics を使います。"
privacyPermissionsTitle: "必要な権限"
privacyStorage: "設定の保存：テーマ、フローティングコントローラー、サイトルールはこのブラウザーだけに残ります。"
privacyHosts: "ページへのアクセス：ページ上の動画と音声を見つけ、フローティングコントローラーを表示するためです。"
privacyNone: "マイク、カメラ、ダウンロード履歴、閲覧履歴にはアクセスしません。"
installEyebrow: "インストール"
installTitle: "ウェブストアから追加。"
installLead: "掲載ページを開いて、ワンクリックで OtterTap を追加します。デベロッパーモードも解凍も不要です。"
installStep1Title: "Chrome に追加"
installStep1Body: "Chrome ウェブストアの掲載ページを開き、追加を確認します。OtterTap はそのままブラウザーにインストールされます。"
installStep2Title: "ボタンを固定"
installStep2Body: "拡張機能メニューから OtterTap を固定すると、ツールバーのボタンが手もとに残ります。"
installStep3Title: "視聴を始める"
installStep3Body: "開いているメディアのページを再読み込みし、ツールバーのボタンかフローティングコントローラーを使います。"
sideloadSummary: "リリースパッケージから読み込む"
sideloadLead: "開発時、またはストアの掲載がないときは、パッケージをダウンロードしてパッケージ化されていない拡張機能として読み込めます。"
sideloadStep1Title: "ダウンロード"
sideloadStep1Body: "GitHub Releases から ottertap-chrome.zip をダウンロードし、置き場所を決められるフォルダーに解凍します。"
sideloadStep2Title: "拡張機能ページを開く"
sideloadStep2Body: "Chrome では chrome://extensions/、Edge では edge://extensions/ を開きます。"
sideloadStep3Title: "拡張機能を読み込む"
sideloadStep3Body: "デベロッパーモードをオンにし、「パッケージ化されていない拡張機能を読み込む」から manifest.json のあるフォルダーを選びます。"
sideloadStep4Title: "視聴を始める"
sideloadStep4Body: "開いているメディアのページを再読み込みし、ツールバーの OtterTap をクリックするか、フローティングコントローラーを使います。"
installUpdate: "読み込んだ版を更新するときは、同じフォルダーを新しいパッケージで上書きし、拡張機能カードの再読み込みを押します。このブラウザー内の設定は残ります。"
faqTitle: "よくある質問"
faqBoostQ: "100% を超えられない動画があるのはなぜですか？"
faqBoostA: "動画を別のドメインから配信しているサイトでは、ブラウザーのセキュリティ上、拡張機能がその音声を処理できません。その場合の上限は 100% です。"
faqPagesQ: "操作できないページはどれですか？"
faqPagesA: "ブラウザーの組み込みページ、拡張機能の実行が許されていないページ、サイトが特別な方法で包んでいる一部のプレーヤーは操作できません。"
faqOverrideQ: "速度や音量がサイトに戻されるのはなぜですか？"
faqOverrideA: "サイト自身が速度や音量を変えることがあります。設定で「速度を固定」をオンにすると、OtterTap が最後に設定した速度を書き戻します。初期状態はオフで、固定するのは速度だけです。サイトが何度も戻す場合は、数回で停止します。音量を戻されたときは、OtterTap で設定し直してください。"
faqBrowsersQ: "対応しているブラウザーは？"
faqBrowsersA: "Chrome と Edge に対応しています。インストールは Chrome ウェブストアから行います。Edge アドオンの掲載が用意できるまでは、リリースパッケージからの読み込みも使えます。"
footerTagline: "OtterTap · ウェブメディア操作"
