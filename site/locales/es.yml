demoRemoveSecond: "Quitar el segundo medio"
demoNote: "La demostración usa un vídeo de ejemplo en silencio. Tras instalarla, OtterTap controla el vídeo y el audio de la página que estás viendo."
demoMediaTitle: "Convertir lo cotidiano en una película"
demoSecondTitle: "Segundo audio · demostración con varios medios"
floatingEyebrow: "Control flotante"
floatingTitle: "Los controles se quedan en la página."
floatingBody: "Ajusta el volumen desde la nutria del borde de la página, sin abrir la barra de herramientas. Pruébala: ya está a la derecha de esta página."
floatingTry: "Prueba la nutria del borde derecho"
floatingPoint1: "La nutria se apoya en el borde de la página, medio oculta, y se muestra entera al pasar el cursor."
floatingPoint2: "Haz clic para abrir la barra de volumen hasta el 200 %, con un botón de silencio abajo."
floatingPoint3: "Arrástrala al lado izquierdo o al derecho. La próxima vez que abras una página seguirá ahí."
floatingPoint4: "Gira la rueda sobre el reproductor principal para cambiar el volumen en pasos del 10 %. Las vistas previas silenciadas y otros vídeos dejan que la página se desplace como siempre. Mantén Alt (Option en Mac) y gírala en cualquier parte de la página. Puedes desactivar la rueda al pasar el cursor en los ajustes."
featuresEyebrow: "Funciones"
featuresTitle: "Los controles que más usas, en un solo sitio."
featuresSubtitle: "OtterTap controla el vídeo y el audio que ya se reproducen en la página. No sustituye a los reproductores ni cambia el diseño."
featurePlaybackTitle: "Reproducción y progreso"
featurePlaybackBody: "Reproduce o pausa, salta según el intervalo de los ajustes y arrastra para buscar, también en directos. Activa la imagen en imagen desde el panel y usa los comandos del navegador para reproducir, buscar y silenciar. En la página, Alt + , . 0 cambian la velocidad y Alt + M silencia. Un modo opcional de una tecla, desactivado de forma predeterminada, añade K, J y L."
featureBoostTitle: "Volumen ampliado al 200 %"
featureBoostBody: "Si un vídeo se oye bajo, amplía el volumen hasta el 200 %. Un limitador evita que los picos distorsionen, y la barra muestra una insignia por encima del 100 %. Al quitar el silencio vuelve el volumen anterior, y subirlo lo desactiva."
featureChannelTitle: "Modos de canal"
featureChannelBody: "En el panel elige estéreo (predeterminado), mono, solo el canal izquierdo o solo el canal derecho. Se combina con el volumen ampliado. Un medio de otro sitio sin CORS no puede cambiar de canal, y Recordar este sitio puede guardar la elección."
featureSpeedTitle: "Velocidad"
featureSpeedBody: "Preajustes de un toque, de 0,75× a 4×. Edítalos y ordénalos en los ajustes. El bloqueo de velocidad es opcional y está desactivado: si lo activas, OtterTap vuelve a escribir tu última velocidad cuando un sitio la cambia. En la página, Alt+0 (también con el modo de una tecla activado) alterna entre 1× y la velocidad que acabas de usar en esta página."
featureMultiTitle: "Varios medios"
featureMultiBody: "Elige el objetivo cuando una página tiene varios vídeos o pistas de audio, incluidos los reproductores insertados. El panel también lista otras pestañas que suenan o están silenciadas."
featureSitesTitle: "Reglas de sitios"
featureSitesBody: "Actívalo en todos los sitios, solo en los que elijas o en todos menos esos. Añadir bilibili.com cubre todas sus páginas."
featureThemeTitle: "Tema sincronizado"
featureThemeBody: "Claro, oscuro o sistema. El panel, los ajustes y el control flotante cambian al momento."
privacyEyebrow: "Privacidad"
privacyTitle: "Tus ajustes se quedan en el navegador."
privacyBody: "La extensión guarda los ajustes en tu navegador, no pide cuenta y no sube información de las páginas. Este sitio usa Vercel Analytics para medir las visitas."
privacyPermissionsTitle: "Lo que necesita"
privacyStorage: "Guardar ajustes: el tema, el control flotante y las reglas de sitios se quedan en tu navegador."
privacyHosts: "Acceder a las páginas: para encontrar el vídeo y el audio, y mostrar el control flotante."
privacyNone: "No accede al micrófono, la cámara, las descargas ni el historial de navegación."
installEyebrow: "Instalar"
installTitle: "Añádela desde Chrome Web Store."
installLead: "Abre la ficha y añade OtterTap con un clic. Sin modo de desarrollador y sin descomprimir."
installStep1Title: "Añadir a Chrome"
installStep1Body: "Abre la ficha de Chrome Web Store y confirma la instalación. OtterTap se instala directamente en el navegador."
installStep2Title: "Fijar el botón"
installStep2Body: "Fija OtterTap desde el menú de extensiones para que el botón de la barra quede a mano."
installStep3Title: "Empieza a ver"
installStep3Body: "Actualiza las páginas con medios que tengas abiertas y usa el botón de la barra o el control flotante."
sideloadSummary: "Instalar desde un paquete de versión"
sideloadLead: "Para desarrollar, o cuando la ficha de la tienda no esté disponible, descarga el paquete y carga la extensión descomprimida."
sideloadStep1Title: "Descargar"
sideloadStep1Body: "Descarga ottertap-chrome.zip desde GitHub Releases y descomprímelo en una carpeta fija."
sideloadStep2Title: "Abrir extensiones"
sideloadStep2Body: "Abre chrome://extensions/ en Chrome, o edge://extensions/ en Edge."
sideloadStep3Title: "Cargar la extensión"
sideloadStep3Body: "Activa el modo de desarrollador, pulsa Cargar descomprimida y elige la carpeta que contiene manifest.json."
sideloadStep4Title: "Empieza a ver"
sideloadStep4Body: "Actualiza las páginas con medios abiertas y pulsa OtterTap en la barra, o usa el control flotante."
installUpdate: "Para actualizar una copia cargada así, sustituye la misma carpeta por el paquete nuevo y pulsa Recargar en la ficha de la extensión. Los ajustes locales se conservan."
faqTitle: "Preguntas frecuentes"
faqBoostQ: "¿Por qué algunos vídeos no pasan del 100 %?"
faqBoostA: "Algunos sitios sirven el vídeo desde otro dominio, y las reglas de seguridad del navegador no permiten que la extensión procese ese audio. El máximo es entonces el 100 %."
faqPagesQ: "¿Qué páginas no se pueden controlar?"
faqPagesA: "Las páginas internas del navegador, las páginas donde no se permite ejecutar extensiones y algunos reproductores que los sitios envuelven de una forma especial."
faqOverrideQ: "¿Por qué un sitio restablece mi velocidad o mi volumen?"
faqOverrideA: "Algunos sitios cambian la velocidad o el volumen por su cuenta. Activa Bloquear la velocidad en los ajustes y OtterTap vuelve a escribir tu última velocidad. Está desactivado de forma predeterminada, solo bloquea la velocidad y se detiene si un sitio la restablece una y otra vez. Si cambia el volumen, vuelve a ajustarlo en OtterTap."
faqBrowsersQ: "¿Qué navegadores son compatibles?"
faqBrowsersA: "Chrome y Edge. La instalación se hace desde Chrome Web Store. Hasta que exista una ficha en los complementos de Edge, también puedes cargar el paquete de una versión."
